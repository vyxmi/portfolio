<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio content</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbfcff;color:#171a24;font:15px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{background:transparent;border:1px solid #c5cada;color:inherit;padding:9px 14px;border-radius:0}button:hover{border-color:#3b57b9}button[aria-pressed=true],button.primary{background:#3b57b9;border-color:#3b57b9;color:white}button:disabled{opacity:.5;cursor:default}input,select,textarea{width:100%;padding:10px;border:1px solid #c5cada;background:white;color:inherit;border-radius:0}textarea{min-height:100px;resize:vertical;line-height:1.6}input[type=checkbox]{width:auto;margin-right:8px}input[type=file]{padding:8px}input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #3b57b9;outline-offset:3px}header{position:sticky;top:0;z-index:3;background:#fbfcff;border-bottom:1px solid #dce0eb;padding:16px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}header h1{font-size:19px;margin:0}header nav{display:flex;gap:8px}#save{margin-left:auto}#status{font-size:13px;color:#3b57b9;max-width:480px;white-space:pre-wrap}.shell{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:calc(100vh - 80px)}aside{padding:24px 16px;background:#f0f2f8;border-right:1px solid #dce0eb}#list{display:flex;flex-direction:column;gap:5px;margin-top:14px}#list button{text-align:left;border:0;padding:12px 10px;overflow-wrap:anywhere}#list small{display:block;font-size:11px;opacity:.75;margin-top:3px}main{padding:30px clamp(20px,4vw,60px);max-width:1280px;min-width:0}h2{font-size:29px;line-height:1.2;letter-spacing:-.03em;margin:0 0 24px}h3{font-size:18px;margin:26px 0 14px}label.field{display:block;margin:0 0 20px}label.field>span{display:block;font-size:13px;margin-bottom:7px;color:#505873}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 22px}.checks{display:flex;gap:10px 20px;flex-wrap:wrap}.checks label{font-size:13px}.item{padding:16px;background:#f0f2f8;margin-bottom:16px;min-width:0}.item .row{margin:8px 0}.item img{display:block;max-width:100%;max-height:230px;object-fit:contain;margin-bottom:12px}.nested{border-left:2px solid #c5cada;padding-left:16px;margin:16px 0}.article-editor{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}.block-list{display:flex;flex-direction:column;gap:5px;align-self:start;max-height:70vh;overflow:auto;position:sticky;top:115px}.block-list button{text-align:left;padding:10px;font-size:13px}.block-list small{display:block;font-size:11px;opacity:.75}.help{color:#606980;font-size:13px}.error{color:#9c2525!important}.preview{color:#3b57b9}.title-row{display:flex;justify-content:space-between;gap:20px;align-items:baseline}summary{cursor:pointer;padding:12px 0;color:#3b57b9}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border-right:0;padding:16px}#list{max-height:220px;overflow:auto}.article-editor{grid-template-columns:1fr}.block-list{position:static;max-height:220px}main{padding:24px 18px}header{padding:12px 18px;gap:10px}#save{margin-left:0}}
html,body{height:100%}body{display:grid;grid-template-rows:auto minmax(0,1fr)}header{position:static}.shell{min-height:0;overflow:hidden}aside,main{overflow-y:auto}main{width:100%}.block-list{top:0}#list button{font-size:13px;line-height:1.4}@media(max-width:800px){body{height:auto;display:block}.shell{overflow:visible}aside,main{overflow-y:visible}}
</style></head><body>
<header><h1>Portfolio content</h1><nav aria-label="Content collections"><button data-collection="brain">Brain</button><button data-collection="projects">Case studies</button><button data-collection="site">Site</button></nav><span id="status" role="status" aria-live="polite">Loading…</span><button id="undo" disabled>Undo last save</button><button id="save" class="primary" disabled>Save</button></header>
<div class="shell"><aside><label class="sr-only" for="search">Find content</label><input id="search" type="search" placeholder="Find content…"><div class="row"><button id="new">New object</button><button id="reload">Reload</button></div><div id="list"></div></aside><main id="editor"></main></div>
<script>window.CONTENT_TOKEN=__EDITOR_TOKEN__;</script><script type="module" src="/editor.js"></script>
</body></html>
